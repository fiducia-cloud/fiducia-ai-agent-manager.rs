name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: repo
          submodules: recursive
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: repo/.github/workflows/ci.yml repo/.github/workflows/cli-flags.yml
      - name: Verify CI, container, and documentation pins agree
        shell: bash
        run: |
          set -euo pipefail
          workflow_ref() {
            awk -v repository="$1" '
              $1 == "repository:" && $2 == repository { found = 1; next }
              found && $1 == "ref:" { print $2; exit }
            ' repo/.github/workflows/ci.yml
          }
          verify_pin() {
            local repository="$1" docker_arg="$2"
            local workflow docker
            workflow="$(workflow_ref "$repository")"
            docker="$(sed -n "s/^ARG ${docker_arg}=//p" repo/Dockerfile)"
            test -n "$workflow"
            test "$workflow" = "$docker"
            grep -Fq "\`$workflow\`" repo/README.md
          }
          verify_pin fiducia-cloud/fiducia-interfaces INTERFACES_REF
          verify_pin fiducia-cloud/fiducia-clients CLIENTS_REF
          verify_pin fiducia-cloud/fiducia-messaging.rs MESSAGING_REF
          verify_pin fiducia-cloud/fiducia-telemetry.rs TELEMETRY_REF
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: bd718cd72d72aa330534f3688f8fb1ce90c19d10
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-clients
          ref: d17e67e1c531ff8e1bc427f21a8bcd0ff57cd214
          path: fiducia-clients
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-messaging.rs
          ref: d3e88b3692bfdb4d387a9aa70fb7af5ecf200c49
          path: fiducia-messaging.rs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-telemetry.rs
          ref: 1128b3f9ab4fb003e918f61ab7743fd5c6c62fc9
          path: fiducia-telemetry.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: repo
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Format
        working-directory: repo
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: repo
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        working-directory: repo
        run: cargo test --all-features --locked
      - name: Release build
        working-directory: repo
        run: cargo build --release --locked
      - name: Dependency audit
        working-directory: repo
        run: cargo audit
